# Nginx reverse proxy configuration for V.E.L.O.C.I.T.Y. Share
# Place this in /etc/nginx/conf.d/velocity-share.conf

upstream velocity_share_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=velocity_limit:10m rate=10r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name share.unitbuilds.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name share.unitbuilds.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/share.unitbuilds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share.unitbuilds.com/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    
    # Hide nginx version
    server_tokens off;
    
    # Request size limits
    client_max_body_size 50M;
    client_body_buffer_size 10M;
    
    # Rate limiting
    limit_req zone=velocity_limit burst=20 nodelay;
    
    # Logging
    access_log /var/log/nginx/velocity-share.access.log;
    error_log /var/log/nginx/velocity-share.error.log;

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://velocity_share_backend;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Metrics endpoint (restrict to internal networks)
    location /metrics {
        # Allow only internal IPs
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://velocity_share_backend;
        proxy_set_header Host $host;
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://velocity_share_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static files (cache aggressively)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://velocity_share_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Default location - proxy to backend
    location / {
        proxy_pass http://velocity_share_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
