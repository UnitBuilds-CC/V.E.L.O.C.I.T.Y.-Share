name: Deploy VelocityShare Server

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Only deploy if CI/CD pipeline succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compress Server Source Files
        run: |
          tar --exclude="**/bin" --exclude="**/obj" --exclude="**/target" -czf share.tar.gz VelocityShare.Server velocity_share_ffi Dockerfile

      - name: Copy Tarball to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 52.188.14.216
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "share.tar.gz"
          target: "/home/azureuser/"

      - name: Extract and Build Container on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 52.188.14.216
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/azureuser
            mkdir -p VelocityShare
            tar -xzf share.tar.gz -C VelocityShare/
            rm share.tar.gz
            sudo docker compose up -d --build velocity-share-server
